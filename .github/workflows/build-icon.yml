name: Build iPhone icon
on:
  push:
    paths:
      - 'icon.svg'
      - '.github/workflows/build-icon.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to Apple touch PNG
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.check_call(['sudo','apt-get','update','-qq'])
          subprocess.check_call(['sudo','apt-get','install','-y','-qq','librsvg2-bin'])
          subprocess.check_call(['rsvg-convert','-w','180','-h','180','icon.svg','-o','apple-touch-icon.png'])
          subprocess.check_call(['rsvg-convert','-w','512','-h','512','icon.svg','-o','icon-512.png'])
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate PNG home screen icons" && git push)
