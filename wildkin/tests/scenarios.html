<!doctype html><html lang="en"><meta charset="utf-8"><title>Wildkin isolated puzzle QA</title><style>body{background:#132632;color:#eef5da;font:15px system-ui;margin:20px}select,button{font:inherit;padding:10px;margin:5px}iframe{display:block;border:1px solid #9adabc;height:844px;margin-top:16px;width:320px}pre{white-space:pre-wrap}</style><label>Region <select id="region"><option value="0">Meadow: irrigation</option><option value="1">Wood: echoes</option><option value="2">Coast: vessels</option><option value="3">Ridge: furnace</option><option value="4">Peaks: wind</option><option value="5">Sanctuary: stars</option></select></label><label>Route <select id="route"><option value="0">One</option><option value="1">Two</option><option value="2">Three</option></select></label><label>Width <select id="width"><option>320</option><option>375</option><option>390</option><option>430</option></select></label><button id="measure">Check scene layout</button><pre id="result" role="status">Isolated QA saves. Does not access the player save key or vault.</pre><iframe id="scene" title="Isolated puzzle scene" src="game-scenario.html?zone=0&route=0"></iframe><script>const frame=document.getElementById('scene'),result=document.getElementById('result');function measure(){const d=frame.contentDocument;if(!d)return;const width=d.documentElement.clientWidth;result.textContent=JSON.stringify({viewport:width,pageWidth:d.documentElement.scrollWidth,overflow:[...d.querySelectorAll('button,input,select,textarea')].filter(e=>{const r=e.getBoundingClientRect();return r.width&&(r.left<-.5||r.right>width+.5)}).map(e=>e.textContent.trim().slice(0,40))},null,2)}function change(){frame.src='game-scenario.html?zone='+document.getElementById('region').value+'&route='+document.getElementById('route').value}document.getElementById('region').onchange=change;document.getElementById('route').onchange=change;document.getElementById('width').onchange=e=>{frame.style.width=e.target.value+'px';requestAnimationFrame(measure)};document.getElementById('measure').onclick=measure;frame.onload=measure;</script></html>
