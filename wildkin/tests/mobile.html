<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildkin phone layout QA</title><style>body{background:#132632;color:#eef5da;font:15px system-ui;margin:20px}select,button{font:inherit;padding:10px}iframe{display:block;border:1px solid #9adabc;height:844px;margin-top:16px;width:390px}pre{white-space:pre-wrap}</style><label for="width">Phone width</label> <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option></select><button id="measure">Check layout</button><pre id="result" role="status">Layout fixture, not physical-device emulation.</pre><iframe id="phone" title="Test phone" src="../"></iframe><script>const frame=document.getElementById('phone'),result=document.getElementById('result');function measure(){const d=frame.contentDocument;if(!d)return;const width=d.documentElement.clientWidth;const overflow=[...d.querySelectorAll('button,input,select,textarea')].filter(e=>{const r=e.getBoundingClientRect();return r.width&& (r.left < -.5||r.right>width+.5)}).map(e=>e.textContent.trim().slice(0,45));result.textContent=JSON.stringify({viewport:width,pageWidth:d.documentElement.scrollWidth,overflow},null,2)}document.getElementById('width').onchange=e=>{frame.style.width=e.target.value+'px';requestAnimationFrame(measure)};document.getElementById('measure').onclick=measure;frame.onload=measure;</script></html>
