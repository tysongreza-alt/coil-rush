// The 2.5 curve was so inexpensive that a pet could reach Elderlight in minutes.
// New pets use a progressively steeper curve. Existing pets keep their displayed
// level and attained evolution when the saved game migrates to this release.
function oldThreshold(n){let q=n-1;return 24*q+15*q*q}
function oldLevel(s){let v=1;while(v<99&&Number(s?.xp||0)>=oldThreshold(v+1))v++;return v}
function previousThreshold(n){let q=Math.max(0,n-1);return Math.round(90*q+38*q*q+1.5*q*q*q)}
// Calibrated for gradual, non-punitive progress; distinct play days still gate later forms.
function newThreshold(n){let q=Math.max(0,n-1);return Math.round(38*q+3*q*q+.17*q*q*q)}
function prepareGrowth(s){
 if(!s)return;
 s.habitMoments=Math.max(0,Math.min(100000,Number(s.habitMoments)||0));s.pathClaims=Array.isArray(s.pathClaims)?s.pathClaims.filter(x=>WONDER_PATH.some(y=>y[0]===x)):[];s.counts=s.counts||{};s.counts.rhythm=Math.max(0,Number(s.counts.rhythm)||0);
 if(!s.growth){let L=oldLevel(s);s.growth={v:3,baseLevel:L,baseXP:Math.max(0,Number(s.xp)||0),stageFloor:L>=21?3:L>=10?2:L>=4?1:0,days:[]}}
 if(s.growth.v===2){const g=s.growth,base=Math.max(1,Math.floor(Number(g.baseLevel)||1));let preserved=base;const anchor=Number(g.baseXP)||0;while(preserved<99&&Number(s.xp||0)>=anchor+previousThreshold(preserved+1)-previousThreshold(base))preserved++;g.v=3;g.baseLevel=preserved;g.baseXP=Math.max(0,Number(s.xp)||0);}
 if(s.growth.v!==3){const L=oldLevel(s);s.growth={v:3,baseLevel:L,baseXP:Math.max(0,Number(s.xp)||0),stageFloor:L>=21?3:L>=10?2:L>=4?1:0,days:[]}}
 const g=s.growth;
 g.baseLevel=clamp(Math.floor(Number(g.baseLevel)||1),1,99);
 g.baseXP=Math.max(0,Number(g.baseXP)||0);
 g.stageFloor=clamp(Math.floor(Number(g.stageFloor)||0),0,3);
 g.days=Array.isArray(g.days)?Array.from(new Set(g.days.filter(d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)))).slice(-150):[];
}
function markGrowthDay(s){if(!s)return;prepareGrowth(s);let d=day();if(!s.growth.days.includes(d)){s.growth.days.push(d);s.growth.days=s.growth.days.slice(-150)}}
function activeDays(s=S){return Array.isArray(s?.growth?.days)?s.growth.days.length:0}
function threshold(n,s=S){
 if(!s?.growth||s.growth.v!==3)return oldThreshold(n);
 const g=s.growth,base=g.baseLevel;
 return n<=base?g.baseXP:g.baseXP+(newThreshold(n)-newThreshold(base));
}
function lvl(s=S){if(!s)return 1;let v=s.growth?.v===3?s.growth.baseLevel:1;while(v<99&&s.xp>=threshold(v+1,s))v++;return v}
function stage(s=S){if(!s)return 0;const L=lvl(s),days=activeDays(s);
 let unlocked=0;for(let i=1;i<4;i++){if(L>=GROWAT[i]&&days>=GROWDAYS[i])unlocked=i}
 const earned=Math.max(unlocked,Number(s.growth?.stageFloor)||0);
 return clamp(earned,0,3);
}
function nextEvolutionInfo(s=S){
 const current=stage(s);if(current>=3)return null;
 const next=current+1;return {next,name:GROWTH[next],level:GROWAT[next],days:GROWDAYS[next],currentLevel:lvl(s),currentDays:activeDays(s)};
}

 const ribbon={care:personalMessage()+' Care raises XP, starbits and hearts; taking time away is always safe.',magic:'Magic raises trick mastery, XP and friendship. Practice again when each spell is ready.',play:'Play earns XP and starbits. Friendship grows most through personal interactions.',garden:'Harvest flowers for starbits, or use the full Grove to decorate four connected areas.',bond:'Heart milestones unlock new personal interactions, memories and visual effects. Hearts are never spent.'};
 let choices='';
 if(homeTab==='magic') choices=unlocked.map(([id,name,emoji])=>`<button class="drawer-action" data-trick="${id}" aria-label="Practice ${name}"><span class="emoji">${emoji}</span><b>${name}</b><small data-ready-at="${(S.careCooldown['trick-'+id]||0)+9000}" data-ready-kind="trick" data-mastery="${S.tricks[id]||0}">Mastery ${S.tricks[id]||0} · ${rewardLabel('trick',S.careCooldown['trick-'+id])}</small></button>`).join('')+`<button class="drawer-action" data-view="play"><span class="emoji">✦</span><b>More magic</b><small>All activities</small></button>`;
 else if(homeTab==='play') choices=`<button class="drawer-action" data-start="stars"><span class="emoji">🌠</span><b>Star Catch</b><small>Tap & collect</small></button><button class="drawer-action" data-start="memory"><span class="emoji">🔮</span><b>Rune Pairs</b><small>Find matches</small></button><button class="drawer-action" data-start="quest"><span class="emoji">🗺️</span><b>Wander Trails</b><small>Explore</small></button><button class="drawer-action" data-start="bloom"><span class="emoji">🎶</span><b>Echo Garden</b><small>Repeat patterns</small></button><button class="drawer-action" data-view="friends"><span class="emoji">🫶</span><b>Friends</b><small>Playdates</small></button>`;
 else if(homeTab==='garden') choices=S.plots.map((p,i)=>`<button class="drawer-action" data-homeplot="${i}"><span class="emoji">${!p?'🌱':grown(p)?(SEEDS.find(x=>x[0]===p.seed)?.[2]||'🌸'):'🌿'}</span><b>${!p?'Plant seed':grown(p)?'Harvest':(SEEDS.find(x=>x[0]===p.seed)?.[1]||'Growing')}</b><small ${p&&SEEDS.find(x=>x[0]===p.seed)?`data-harvest-at="${p.at+SEEDS.find(x=>x[0]===p.seed)[5]*60000}"`:''}>${!p?'Spot '+(i+1)+' · empty':grown(p)?'Ready to harvest!':'Ready in '+timeUntil(p.at+SEEDS.find(x=>x[0]===p.seed)[5]*60000)}</small></button>`).join('')+`<button class="drawer-action" data-view="grove"><span class="emoji">🏡</span><b>Your Grove</b><small>Decorate</small></button>`;
 else if(homeTab==='bond')choices=friendshipPanel();
 else choices=`<button class="drawer-action" data-act="feed"><span class="emoji">🫐</span><b>Give treat</b><small data-ready-at="${(S.careCooldown['feed']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['feed'])}</small></button><button class="drawer-action" data-act="brush"><span class="emoji">🪮</span><b>Brush</b><small data-ready-at="${(S.careCooldown['brush']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['brush'])}</small></button><button class="drawer-action" data-act="cuddle"><span class="emoji">💗</span><b>Cuddle</b><small data-ready-at="${(S.careCooldown['cuddle']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['cuddle'])}</small></button><button class="drawer-action" data-act="pet"><span class="emoji">🫶</span><b>Say hello</b><small data-ready-at="${(S.careCooldown['pet']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['pet'])}</small></button>`;
 return `<div class="home-shell"><div class="heading home-heading"><div class="kicker">YOUR FOREVER FRIEND · <button class="tiny-link" data-view="pets" aria-label="See all your pets">${sanctuary.pets.length} in sanctuary ↗</button></div><h1>${esc(S.pet.name)}'s little world <span style="color:#bc93ba">✦</span></h1><button class="tiny-link pet-edit-home" data-editpet="${esc(S.id)}" aria-label="Edit ${esc(S.pet.name)} name and appearance">✎ Edit name & look</button><button class="tiny-link pet-edit-home" data-act="openwardrobe">♛ Dress up</button></div>
 <section class="welcome-guidance" aria-label="Suggested next adventure"><div class="guidance-top"><span class="kicker">A little adventure for today</span><button class="inline-link" data-view="play">All activities ›</button></div><p class="guidance-personality">${esc(personalMessage())}</p>${(()=>{const n=wonderStep();return n?`<div class="guidance-goal"><span class="goal-text"><strong>${esc(n[1])}</strong><small>${esc(n[2])} · ${pathProgress()}/${n[4]}</small></span>${wonderValue(n[3])>=n[4]?`<button class="btn small" data-act="claimpath">Collect ✦${n[5]}</button>`:`<button class="btn small secondary" data-view="play">Explore ›</button>`}</div>`:`<div class="guidance-goal"><strong>All Wonder Path chapters completed!</strong><button class="btn small secondary" data-view="journal">Your memories ›</button></div>`})()}</section>
 <div class="hero home-hero ${areaScene==='day'?'':esc(areaScene)}">${woodlandScene(areaScene)}<div class="sun"></div><div class="orbs">${Array.from({length:13},(_,i)=>`<i class="orb" style="left:${5+(i*31)%91}%;top:${9+(i*29)%58}%;animation-delay:${(i%7)*.3}s"></i>`).join('')}</div><div class="hill1"></div><div class="hill2"></div>${areaSwitcher()}${areaDecorHTML(area)}<button class="pet-stage bond-tier-${bondRank()}" id="petStage" data-act="pet" aria-label="Pet ${esc(S.pet.name)}">${svgPet(S.pet,st)}</button><div class="fx-burst" id="petFX" aria-hidden="true"></div></div>
 <div class="home-growth-hint" data-act="evolutionguide" role="button" tabindex="0" aria-label="View evolution goals">${(()=>{const n=nextEvolutionInfo();return n?`Next form: ${n.name} · Lv ${n.currentLevel}/${n.level} · Play days ${n.currentDays}/${n.days} ›`:'Fully evolved · Keep discovering new magic ›'})()}</div><div class="home-meta"><div class="home-meta-top"><div><b class="pet-label">${esc(S.pet.name)}</b> <button class="pill evolution-entry" data-act="evolutionguide" aria-label="See the growth journey">${GROWTH[st]} ✧</button></div><span class="tiny">${info.remaining} XP to Lv ${Math.min(99,info.L+1)} · ♡ ${compact(S.bond)}</span></div><div class="progress" aria-label="Level progress ${Math.round(info.pct)} percent"><span style="width:${info.pct}%"></span></div></div>
 <section class="home-dock ${!drawerOpen?'compact':''}" aria-label="Pet activities"><div class="drawer-shell"><button class="drawer-handle" data-drawer-toggle aria-label="${drawerOpen?'Minimize':'Expand'} activities" aria-expanded="${drawerOpen}"></button><div class="drawer-tabs">${[['care','♡','Care'],['magic','✧','Magic'],['play','✦','Play'],['garden','❀','Garden'],['bond','♥','Bond']].map(([tab,icon,label])=>`<button class="drawer-tab ${homeTab===tab?'active':''}" data-hometab="${tab}" aria-label="${label}" aria-pressed="${homeTab===tab}"><span class="drawer-tab-ico">${icon}</span>${label}</button>`).join('')}</div>${drawerOpen?`<div class="drawer-body"><div class="drawer-panel-top"><span id="drawerHint" class="drawer-hint ${now()<feedbackUntil?'is-feedback':''}" data-guide="${esc(ribbon[homeTab])}" aria-live="polite">${esc(now()<feedbackUntil?feedbackMessage:ribbon[homeTab])}</span>${homeTab==='magic'?`<button class="drawer-link" data-view="play">See all →</button>`:homeTab==='garden'?`<button class="drawer-link" data-view="grove">Full grove →</button>`:homeTab==='bond'?`<button class="drawer-link" data-act="bondguide">Milestones →</button>`:''}</div><div class="drawer-rail" data-rail-tab="${homeTab}">${choices}</div></div>`:''}</div></section></div>`;
}

function pets(){const pals=meetCompanions();return `<div class="heading"><span class="kicker">Your little family</span><h1>My sanctuary ♡</h1><p>Give up to eight creatures a forever home. Every friend keeps their own growth, memories and belongings. <button class="inline-link" data-view="friends">Visit family friends →</button></p></div><section class="section"><div class="sanctuary-grid">${sanctuary.pets.map(p=>{const active=p.id===S.id,lev=lvl(p),st=stage(p);return `<article class="companion-card ${active?'chosen':''}"><div class="companion-scene">${woodlandScene(p.scene||'day')}<div class="companion-portrait">${svgPet(p.pet,st,true)}</div></div><div class="companion-info"><div><h3>${esc(p.pet.name)}</h3><small>Level ${lev} · ${GROWTH[st]} · ♡ ${compact(p.bond)}</small></div><span class="stage-mark">${active?'Current':'Saved'}</span></div><div class="companion-actions"><button class="btn small light" data-editpet="${esc(p.id)}" aria-label="Edit ${esc(p.pet.name)} name and appearance">✎ Edit</button>${active?`<button class="btn small secondary" data-view="home">Home ♡</button>`:`<button class="btn small" data-switchpet="${esc(p.id)}">Switch to ${esc(p.pet.name)}</button><button class="btn small secondary" data-petmeet="${esc(p.id)}">Playdate</button>`}</div></article>`}).join('')}</div><button class="btn full sanctuary-adopt" data-act="adoptpet" ${sanctuary.pets.length>=8?'disabled':''}>+ Welcome another little wonder (${sanctuary.pets.length}/8)</button><div class="note" style="margin-top:12px">Each pet has its own progress. Use Journal → Back up to save a copy of the whole sanctuary. Pets live on this browser unless you transfer a backup.</div></section>${pals.length?`<section class="section"><div class="card"><div class="section-head"><h2>Playdate meadow</h2><span class="pill">Together is better</span></div><p>Bring your pets together! Choose a friend and both companions earn friendship, stars and experience through play.</p><button class="btn secondary full" data-petmeet="${esc(pals[0].id)}">Visit the meadow with ${esc(pals[0].pet.name)}</button></div></section>`:''}`}
function together(){const pals=meetCompanions();return pets()}
function play(){let L=lvl();return `<div class="heading"><span class="kicker">Make magical memories</span><h1>Let's play ✨</h1><p>Four playful activities, a growing library of adventures, and magical tricks. There is no wrong way to enjoy your pet.</p></div><section class="journey-quick" aria-label="Your next goal">${(()=>{const n=wonderStep();return n?`<div><span class="kicker">Your next chapter · ${S.pathClaims?.length||0}/${WONDER_PATH.length}</span><b>${esc(n[1])}</b><small>${esc(n[2])} · ${pathProgress()}/${n[4]}</small></div>${wonderValue(n[3])>=n[4]?`<button class="btn small" data-act="claimpath">Collect ✦${n[5]}</button>`:`<button class="btn small secondary" data-view="journal">See journey →</button>`}`:`<div><span class="kicker">All chapters complete</span><b>Continue writing your own story!</b></div><button class="btn small secondary" data-view="journal">Your memories →</button>`})()}</section><section class="section"><div class="grid2"><button class="gamecard" data-start="stars"><span class="gameicon">🌠</span><span><h3>Star Catch</h3><small>Catch as many twinkling stars as you can.</small></span></button><button class="gamecard" data-start="memory"><span class="gameicon">🔮</span><span><h3>Rune Pairs</h3><small>Uncover and match magical runes.</small></span></button><button class="gamecard" data-start="quest"><span class="gameicon">🗺️</span><span><h3>Wander Trails</h3><small>Choose your own tiny adventure.</small></span></button><button class="gamecard" data-start="bloom"><span class="gameicon">🎶</span><span><h3>Echo Garden</h3><small>Watch a magical pattern and play it back. No time limit.</small></span></button><button class="gamecard" data-view="grove"><span class="gameicon">🌿</span><span><h3>Grow & Decorate</h3><small>Build a home that feels like yours.</small></span></button></div></section><section class="section"><div class="section-head"><h2>Learned magic</h2><span class="pill">Practice to master</span></div><div class="grid2">${TRICKS.map(([id,name,emoji,need])=>`<button class="gamecard" data-trick="${id}" ${L<need?'disabled':''}><span class="gameicon">${emoji}</span><span><h3>${name}</h3><small>${L<need?'Unlocks at level '+need:'Mastery '+(S.tricks[id]||0)}</small></span></button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Your Wonder Path</h2><span class="pill">${S.pathClaims?.length||0}/${WONDER_PATH.length} chapters</span></div><p class="sub">Small lifetime goals that build on your adventures. No streaks, deadlines or resets.</p>${(()=>{const n=wonderStep();return n?`<div class="card wonder-path"><div class="kicker">Next chapter</div><h3>${esc(n[1])}</h3><p>${esc(n[2])}</p><div class="progress"><span style="width:${100*pathProgress()/n[4]}%"></span></div><div class="path-bottom"><span>${pathProgress()}/${n[4]} · Reward ✦${n[5]}</span><button class="btn small" data-act="claimpath" ${wonderValue(n[3])<n[4]?'disabled':''}>${wonderValue(n[3])>=n[4]?'Collect reward':'Still discovering'}</button></div></div>`:`<div class="card wonder-path">Your whole Wonder Path is complete! Keep finding new stories, mastering tricks, growing flowers and building your sanctuary.</div>`})()}</section>
 <section class="section"><h2>Your daily wishes</h2><p class="sub">Little goals you can enjoy anytime. Miss a day? Nothing is lost.</p>${renderWishes()}</section>`}
function getWishes(){if(S.wishes.date!==day()){S.wishes={date:day(),done:[],base:{care:S.counts.care,game:S.counts.games,quest:S.counts.quests}};save()}return [['care','Share three caring moments',()=>S.counts.care,3],['game','Play two minigames',()=>S.counts.games,2],['quest','Visit a magical trail',()=>S.counts.quests,1]].map(([id,label,fn,need])=>({id,label,need,now:fn()}))}
function renderWishes(){getWishes();const base=S.wishes.base||{};return getWishes().map(w=>{let n=Math.max(0,Math.min(w.need,w.now-(base[w.id]||0))),done=S.wishes.done.includes(w.id),ready=n>=w.need;return `<div class="mission"><div class="micon" aria-hidden="true">${done?'✦':'🌸'}</div><div class="mission-detail"><div class="mtitle">${w.label}</div><div class="mdesc">${done?'A lovely memory for today':`${n} of ${w.need} · A little extra starbit gift`}</div><div class="wish-progress"><span style="width:${100*n/w.need}%"></span></div></div><button class="btn small ${done?'light':ready?'':'secondary'}" data-wish="${w.id}" ${done||!ready?'disabled':''}>${done?'Collected':ready?'Collect ✦25':`${n}/${w.need}`}</button></div>`}).join('')}

let wearCategory='hat';
function wearOwner(){if(!Array.isArray(S.wardrobeOwned))S.wardrobeOwned=[];S.pet.outfit=cleanOutfit(S.pet.outfit)}
function wearBuy(id){const x=WARDROBE_BY_ID[id];if(!x)return;wearOwner();const [key,name,slot,kind,col,accent,cost,need]=x;
 if(!S.wardrobeOwned.includes(key)){if(lvl()<need){tip('Reach level '+need+' to unlock this style.');return}if(S.coins<cost){tip('You need '+(cost-S.coins)+' more starbits.');return}S.coins-=cost;S.wardrobeOwned.push(key);addLog(S.pet.name+' bought '+name+' for the wardrobe.');sound('buy')}
 S.pet.outfit[slot]=S.pet.outfit[slot]===key?null:key;save();render();tip(S.pet.outfit[slot]===key?name+' equipped!':'Outfit item removed. Kept in your wardrobe.');sound('equip')}
function removeWear(slot){wearOwner();if(!['hat','neck','body'].includes(slot))return;S.pet.outfit[slot]=null;save();render();tip('Stored safely in your wardrobe.');sound('equip')}
function wardrobeHTML(){wearOwner();const options=WARDROBE.filter(w=>w[2]===wearCategory);const worn=S.pet.outfit[wearCategory];return `<div class="wardrobe-workshop"><div class="wardrobe-stage"><div class="wardrobe-pet">${svgPet(S.pet,stage())}</div><div><b>Dress ${esc(S.pet.name)}</b><small>${S.wardrobeOwned.length} of ${WARDROBE.length} accessories collected</small><small>Hats, accessories and outfits are cosmetic. They never expire.</small></div></div><div class="shop-filters wear-tabs">${[['hat','Hats · 36'],['neck','Accessories · 18'],['body','Outfits · 18']].map(([v,label])=>`<button data-wearcat="${v}" class="${wearCategory===v?'selected':''}">${label}</button>`).join('')}</div><div class="wear-grid">${options.map(([id,name,slot,kind,color,accent,price,need])=>{let owned=S.wardrobeOwned.includes(id),equipped=worn===id;return `<div class="wear-card"><div class="wear-preview" style="--wear:${color};--trim:${accent}"><svg viewBox="${slot==='hat'?'75 25 160 116':slot==='neck'?'96 178 115 92':'62 164 190 147'}" aria-hidden="true">${wearSvg({outfit:{[slot]:id}})}</svg></div><strong>${esc(name)}</strong><small>${equipped?'Wearing now':owned?'Owned forever':lvl()<need?'Unlock at level '+need:'✦ '+price+' starbits'}</small><button class="btn small ${owned?'secondary':''}" data-wearbuy="${id}" ${!owned&&lvl()<need?'disabled':''}>${equipped?'Remove':owned?'Wear':'Buy · ✦'+price}</button></div>`}).join('')}</div>${worn?`<button class="btn secondary" data-unwear="${wearCategory}">Remove this item</button>`:''}</div>`}
function placePalette(){worldLayout();return `<div class="placement-guide"><div class="guide-number">1</div><div><b>Choose a decoration</b><small>Tap any item you own. The empty spots will glow. You can switch clearings with the arrows.</small></div></div><div class="placement-rack" aria-label="Your purchased decorations">${S.owned.map((id,i)=>{let d=DECOR.find(x=>x[0]===id),loc=locationOf(id);if(!d)return '';return `<button draggable="true" data-pickdecor="${id}" class="placement-item ${id===selectedDecor?'chosen':''}" title="${esc(d[1])}" aria-pressed="${id===selectedDecor}"><span class="placement-thumb">${gardenArtwork(id,'rack-'+i)}</span><span>${esc(d[1])}</span><small>${loc?(loc.area===worldArea()?'Here':'In '+AREAS.find(x=>x[0]===loc.area)[1]):'Stored'}</small></button>`}).join('')}</div><div class="placement-guide step-two"><div class="guide-number">2</div><div><b>${selectedDecor?'Tap a glowing spot to place '+esc(DECOR.find(x=>x[0]===selectedDecor)?.[1]||selectedDecor):'Choose a spot in the scene'}</b><small>${selectedDecor?'Tap an occupied spot to swap items. Use the arrows for other clearings.':'Or tap any displayed decoration to pick it up and move it.'}</small></div></div>`}
function grove(){const area=worldArea(),chosen=AREAS.find(x=>x[0]===area),layout=worldLayout(),areaIndex=AREAS.findIndex(x=>x[0]===area),decorList=DECOR.filter(x=>shopCategory==='all'||(shopCategory==='owned'?S.owned.includes(x[0]):decorCategory(x[0])===shopCategory));
 return `<div class="heading"><span class="kicker">Your world, your way</span><h1>Moonpetal Grove</h1><p>Your purchased decorations are yours forever. Place every item across four clearings, with no tiny sticker limit.</p></div><section class="section world-builder" id="decorEditor"><div class="section-head"><h2>Arrange your habitat</h2><span class="pill">${S.owned.length} owned · ${Object.values(layout).flat().filter(Boolean).length} displayed</span></div><div class="area-editor-header"><button data-area-step="-1" aria-label="Previous clearing">‹</button><div><b>${chosen[1]}</b><small>Clearing ${areaIndex+1} of 4 · ${layout[area].filter(Boolean).length} of 12 positions</small></div><button data-area-step="1" aria-label="Next clearing">›</button></div>${placePalette()}<div class="hero world-editor ${chosen[2]} ${selectedDecor?'placing':''}">${woodlandScene(chosen[2])}${areaDecorHTML(area,true)}<div class="editor-pet">${svgPet(S.pet,stage(),true)}</div></div><p class="editor-instructions">${selectedDecor?'Selected: '+esc(DECOR.find(x=>x[0]===selectedDecor)?.[1]||selectedDecor)+'. Tap any position to place or swap.':'Choose any decoration in your collection above, then tap a spot in the scene. No dragging required.'}</p>${selectedDecor?`<div class="btn-row"><button class="btn small" data-act="storedecor">Store selected item</button><button class="btn small secondary" data-act="canceledit">Cancel move</button></div>`:''}<div class="area-index">${AREAS.map(([id,name])=>`<button class="${id===area?'selected':''}" data-area="${id}">${name}<small>${layout[id].filter(Boolean).length}/12</small></button>`).join('')}</div></section>
 <section class="section"><div class="section-head"><h2>Enchanted garden</h2><button class="btn small secondary" data-act="seedhelp">Seeds & growth</button></div><div class="grid3">${S.plots.map((p,i)=>{let seed=SEEDS.find(x=>x[0]===p?.seed),matured=p&&seed&&now()-p.at>=seed[5]*60000;return `<button class="gardenplot" data-plot="${i}"><span class="sprout">${!p?'🌱':matured?seed[2]:'🌿'}</span><b>${!p?'Plant something':matured?'Ready to gather':seed[1]}</b><small class="garden-time" ${p&&seed?`data-harvest-at="${p.at+seed[5]*60000}"`:''}>${!p?'Tap to plant':matured?'Ready to harvest!':'Ready in '+timeUntil(p.at+seed[5]*60000)}</small></button>`}).join('')}</div><p class="tiny">These plants never wilt. They grow while you are away.</p></section>
 <section class="section"><div class="section-head"><h2>Wonder Workshop</h2><span class="pill">✦ ${compact(S.coins)} starbits</span></div><p class="sub">Starbits buy decorations. Hearts unlock friendship moments, while XP unlocks new evolutionary stages.</p><div class="tabs"><button data-sub="decor" class="${subtab==='decor'?'selected':''}">Shop & Collection</button><button data-sub="wear" class="${subtab==='wear'?'selected':''}">Wardrobe · 72</button><button data-sub="sky" class="${subtab==='sky'?'selected':''}">Skies</button><button data-sub="looks" class="${subtab==='looks'?'selected':''}">Pet style</button></div>${subtab==='wear'?wardrobeHTML():subtab==='decor'?`<div class="shop-filters">${[['owned','My Items'],['all','All'],['plants','Plants'],['structures','Cottages'],['water','Water'],['magic','Magic']].map(([key,name])=>`<button class="${shopCategory===key?'selected':''}" data-shopcat="${key}">${name}</button>`).join('')}</div><div class="grid3 shop-grid">${decorList.map(([id,name,emoji,price,need])=>{let own=S.owned.includes(id),where=own?locationOf(id):null;return `<div class="shopitem"><div class="decor-preview">${gardenArtwork(id,'shop-'+id)}</div><b>${name}</b><small>${lvl()<need?'Unlock Lv '+need:own?(where?'Displayed in '+AREAS.find(x=>x[0]===where.area)[1]:'Stored in collection'):'✦ '+price}</small><button class="btn small ${own?'secondary':''}" data-buy="${id}" ${!own&&lvl()<need?'disabled':''}>${own?(where?'Move':'Place'):'Buy ✦ '+price}</button></div>`}).join('')}</div><p class="tiny">Buying an item places it automatically in the least crowded clearing. To move one, tap Move, then tap a position in the editor above. You keep purchased items forever.</p>`:subtab==='sky'?`<div class="grid2" style="margin-top:12px">${[['day','Morning glow','🌤️'],['dusk','Starlit dusk','🌌'],['dawn','Misty dawn','🌄'],['forest','Forest whisper','🌳']].map(([id,name,emoji])=>`<button class="gamecard" data-sky="${id}" style="border:${S.scene===id?'2px solid #9c86d0':''}"><span class="gameicon">${emoji}</span><span><h3>${name}</h3><small>${S.scene===id?'Selected':'Tap to select for your meadow'}</small></span></button>`).join('')}</div>`:`<div class="card" style="margin-top:10px"><div class="gueststage">${svgPet(S.pet,stage())}</div><p>Change colors and markings whenever you like. Your friend keeps all progress.</p><button class="btn full" data-act="restyle">Customize your pet</button></div>`}</section>`
}

 <section class="section"><div class="section-head"><h2>Discovery album</h2><span class="pill">${S.stamps.length} / ${STAMPS.length}</span></div><div class="grid3">${STAMPS.map(st=>`<div class="achievement ${S.stamps.includes(st)?'':'locked'}" style="min-height:65px"><span class="emoji">${S.stamps.includes(st)?st:'❔'}</span><small>${S.stamps.includes(st)?'Found':'Undiscovered'}</small></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Milestones</h2><span class="pill">${ACH.filter(a=>a[3](S)).length} / ${ACH.length}</span></div><div class="badgegrid">${ACH.map(([id,name,emoji,check])=>`<div class="achievement ${check(S)?'':'locked'}"><span class="emoji">${check(S)?emoji:'🔒'}</span><b>${name}</b><small>${check(S)?'Earned':'Keep exploring'}</small></div>`).join('')}</div></section><section class="section"><h2>Our little memories</h2><div class="card">${S.journal.slice(0,18).map(e=>`<div class="item-line"><span style="font-size:17px">✦</span><div style="flex:1"><b>${esc(e.message)}</b><small>${new Date(e.at).toLocaleDateString()}</small></div></div>`).join('')}</div></section><section class="section"><h2>Keep your world safe</h2><div class="card"><p>Your progress is saved automatically on this device and browser. To move to another phone or safeguard your pet, save a backup file.</p><div class="btn-row"><button class="btn secondary" data-act="backup">Export backup</button><button class="btn light" data-act="restore">Import backup</button></div><div class="divider"></div><button class="btn small ghost" data-act="reset">Remove this pet from sanctuary</button></div></section><footer>Made with care. No ads, accounts, tracking scripts, or purchases.</footer>`}

function flip(i){

  game.turns++;

   setTimeout(()=>{if(game?.kind==='memory'){game.flipped=[];game.locked=false;if(modal?.type==='memory')render()}},750);
  }
 }

document.addEventListener('input',e=>{if(e.target.id==='petName'){creator.name=e.target.value;const label=$('#editorPreviewName');if(label)label.textContent=creator.name.trim()||'Your new friend'}});
document.addEventListener('click',e=>{let a=e.target.closest('[data-view],[data-act],[data-trick],[data-buy],[data-sky],[data-sub],[data-plot],[data-plant],[data-start],[data-wish],[data-rune],[data-biome],[data-questchoice],[data-createkey],[data-visit],[data-hometab],[data-switchpet],[data-petmeet],[data-together],[data-area-step],[data-area],[data-worldslot],[data-shopcat],[data-bondact],[data-editpet],[data-wearbuy],[data-wearcat],[data-unwear],[data-pickdecor],[data-echo]');if(!a)return;if(a.disabled)return;let d=a.dataset;if(d.echo!==undefined){echoChoose(Number(d.echo))}else if(d.areaStep){changeArea(Number(d.areaStep))}else if(d.area){S.worldArea=d.area;save();render()}else if(d.worldslot!==undefined){moveDecorSlot(Number(d.worldslot))}else if(d.shopcat){shopCategory=d.shopcat;render()}else if(d.wearcat){wearCategory=d.wearcat;render()}else if(d.wearbuy){wearBuy(d.wearbuy)}else if(d.unwear){removeWear(d.unwear)}else if(d.pickdecor){selectDecor(d.pickdecor)}else if(d.bondact){bondMove(d.bondact)}else if(d.editpet){openPetEditor(d.editpet)}else if(d.view){view=d.view;modal=null;render();scrollTo({top:0,behavior:'instant'})}else if(d.switchpet){switchCompanion(d.switchpet)}else if(d.petmeet){open('companions',{friendId:d.petmeet})}else if(d.together){togetherReward(d.together)}else if(d.hometab){homeTab=d.hometab;render()}else if(d.createkey){let key=d.createkey;if(key==='color')creator[key]=Number(d.createval);else creator[key]=d.createval;const group=a.closest('[data-option-group]');if(group)group.querySelectorAll('[data-createkey]').forEach(b=>{const active=b===a;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active))});const preview=$('#editorPreviewArt');if(preview){const target=modal?.type==='restyle'?sanctuary.pets.find(q=>q.id===editingPetId):null;preview.innerHTML=svgPet({...creator,name:creator.name||'Mimble'},target?stage(target):0)}}else if(d.act){handleAction(d.act)}else if(d.trick){trick(d.trick)}else if(d.buy){buy(d.buy)}else if(d.sky){S.scene=d.sky;save();render();tip('A new sky to dream beneath!')}else if(d.sub){subtab=d.sub;render()}else if(d.plot!==undefined){plot(Number(d.plot))}else if(d.plant){plant(d.plant)}else if(d.start){startGame(d.start)}else if(d.wish){wish(d.wish)}else if(d.rune!==undefined){flip(Number(d.rune))}else if(d.biome){questBiome(d.biome)}else if(d.questchoice){questChoice(+d.questchoice)}else if(d.visit!==undefined){open('visitor',{friend:S.friends[Number(d.visit)]})}});
document.addEventListener('dragstart',e=>{const item=e.target.closest('[data-pickdecor]');if(!item)return;const id=item.dataset.pickdecor;if(!S?.owned.includes(id))return;e.dataTransfer?.setData('text/plain',id);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-worldslot]'))e.preventDefault()});
document.addEventListener('drop',e=>{const slot=e.target.closest('[data-worldslot]');if(!slot)return;e.preventDefault();const id=e.dataTransfer?.getData('text/plain');if(!S?.owned.includes(id))return;selectedDecor=id;moveDecorSlot(Number(slot.dataset.worldslot))});
window.addEventListener('hashchange',handleInviteFromURL);
window.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&modal?.type!=='stars')render()});
window.addEventListener('load',registerUpdates);
// Initialize new day baselines for goals, without ever resetting progress or hurting pets.
if(S){if(!S.wishes||S.wishes.date!==day()){S.wishes={date:day(),done:[],base:{care:S.counts.care,game:S.counts.games,quest:S.counts.quests}};save()}else if(!S.wishes.base){S.wishes.base={care:S.counts.care,game:S.counts.games,quest:S.counts.quests};save()}}
if(S){for(const p of sanctuary.pets)worldLayout(p);save()}render();handleInviteFromURL();
})();
</script></body></html>
