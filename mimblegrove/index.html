 else choices=`<button class="drawer-action" data-act="feed"><span class="emoji">🫐</span><b>Give treat</b><small data-ready-at="${(S.careCooldown['feed']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['feed'])}</small></button><button class="drawer-action" data-act="brush"><span class="emoji">🪮</span><b>Brush</b><small data-ready-at="${(S.careCooldown['brush']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['brush'])}</small></button><button class="drawer-action" data-act="cuddle"><span class="emoji">💗</span><b>Cuddle</b><small data-ready-at="${(S.careCooldown['cuddle']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['cuddle'])}</small></button><button class="drawer-action" data-act="pet"><span class="emoji">🫶</span><b>Say hello</b><small data-ready-at="${(S.careCooldown['pet']||0)+15000}" data-ready-kind="care">${rewardLabel('care',S.careCooldown['pet'])}</small></button>`;
 return `<div class="home-shell"><div class="heading home-heading"><div class="kicker">YOUR FOREVER FRIEND</div><h1>${esc(S.pet.name)}'s little world <span style="color:#bc93ba">✦</span></h1></div>
 <div class="hero home-hero ${scene==='day'?'':esc(scene)}"><div class="sun"></div><div class="orbs">${Array.from({length:13},(_,i)=>`<i class="orb" style="left:${5+(i*31)%91}%;top:${9+(i*29)%58}%;animation-delay:${(i%7)*.3}s"></i>`).join('')}</div><div class="hill1"></div><div class="hill2"></div><div class="pet-caption">♡ ${charmLine(S.pet)}</div>${Array.from({length:8},(_,i)=>`<div class="flower" style="left:${3+i*13}%;bottom:${12+(i%3)*8}px;animation-delay:${i*.23}s">${i%3===0?'🌷':i%3===1?'✿':'❀'}</div>`).join('')}${decor.map((id,i)=>`<div class="pet-decor ${i===0?'left':'right'}">${decoration(id)}</div>`).join('')}<button class="pet-stage" id="petStage" data-act="pet" aria-label="Pet ${esc(S.pet.name)}">${svgPet(S.pet,st)}</button><div class="fx-burst" id="petFX" aria-hidden="true"></div></div>
 <div class="home-meta"><div class="home-meta-top"><div><b class="pet-label">${esc(S.pet.name)}</b> <span class="pill">${GROWTH[st]}</span></div><span class="tiny">${info.remaining} XP to Lv ${Math.min(99,info.L+1)} · ♡ ${compact(S.bond)}</span></div><div class="progress" aria-label="Level progress ${Math.round(info.pct)} percent"><span style="width:${info.pct}%"></span></div></div>
 <section class="home-dock ${!drawerOpen?'compact':''}" aria-label="Pet activities"><div class="drawer-shell"><button class="drawer-handle" data-drawer-toggle aria-label="${drawerOpen?'Minimize':'Expand'} activities" aria-expanded="${drawerOpen}"></button><div class="drawer-tabs">${[['care','♡','Care'],['magic','✧','Magic'],['play','✦','Play'],['garden','❀','Garden']].map(([tab,icon,label])=>`<button class="drawer-tab ${homeTab===tab?'active':''}" data-hometab="${tab}" aria-label="${label}" aria-pressed="${homeTab===tab}"><span class="drawer-tab-ico">${icon}</span>${label}</button>`).join('')}</div>${drawerOpen?`<div class="drawer-body"><div class="drawer-panel-top"><span id="drawerHint" class="drawer-hint ${now()<feedbackUntil?'is-feedback':''}" data-guide="${esc(ribbon[homeTab])}" aria-live="polite">${esc(now()<feedbackUntil?feedbackMessage:ribbon[homeTab])}</span>${homeTab==='magic'?`<button class="drawer-link" data-view="play">See all →</button>`:homeTab==='garden'?`<button class="drawer-link" data-view="grove">Full grove →</button>`:''}</div><div class="drawer-rail">${choices}</div></div>`:''}</div></section></div>`;
}

function play(){let L=lvl();return `<div class="heading"><span class="kicker">Make magical memories</span><h1>Let's play ✨</h1><p>Three games, endless adventures, and new tricks to master. Every game earns Wonder XP and starbits.</p></div><section class="section"><div class="grid2"><button class="gamecard" data-start="stars"><span class="gameicon">🌠</span><span><h3>Star Catch</h3><small>Catch as many twinkling stars as you can.</small></span></button><button class="gamecard" data-start="memory"><span class="gameicon">🔮</span><span><h3>Rune Pairs</h3><small>Uncover and match magical runes.</small></span></button><button class="gamecard" data-start="quest"><span class="gameicon">🗺️</span><span><h3>Wander Trails</h3><small>Choose your own tiny adventure.</small></span></button><button class="gamecard" data-view="grove"><span class="gameicon">🌿</span><span><h3>Grow & Decorate</h3><small>Build a home that feels like yours.</small></span></button></div></section><section class="section"><div class="section-head"><h2>Learned magic</h2><span class="pill">Practice to master</span></div><div class="grid2">${TRICKS.map(([id,name,emoji,need])=>`<button class="gamecard" data-trick="${id}" ${L<need?'disabled':''}><span class="gameicon">${emoji}</span><span><h3>${name}</h3><small>${L<need?'Unlocks at level '+need:'Mastery '+(S.tricks[id]||0)}</small></span></button>`).join('')}</div></section><section class="section"><h2>Your daily wishes</h2><p class="sub">Little goals you can enjoy anytime. Miss a day? Nothing is lost.</p>${renderWishes()}</section>`}
function getWishes(){if(S.wishes.date!==day()){S.wishes={date:day(),done:[],base:{care:S.counts.care,game:S.counts.games,quest:S.counts.quests}};save()}return [['care','Share three caring moments',()=>S.counts.care,3],['game','Play two minigames',()=>S.counts.games,2],['quest','Visit a magical trail',()=>S.counts.quests,1]].map(([id,label,fn,need])=>({id,label,need,now:fn()}))}
function renderWishes(){let date=S.wishes.date,done=S.wishes.done||[];return getWishes().map(w=>`<div class="mission"><div class="micon">${done.includes(w.id)?'🌟':'🌸'}</div><div style="flex:1"><div class="mtitle">${w.label}</div><div class="mdesc">A gentle gift, whenever you're ready.</div></div><button class="btn small ${done.includes(w.id)?'light':'secondary'}" data-wish="${w.id}" ${done.includes(w.id)?'disabled':''}>${done.includes(w.id)?'Done':'Claim ✦ 25'}</button></div>`).join('')}
function grove(){return `<div class="heading"><span class="kicker">Your forever home</span><h1>Moonpetal Grove 🌷</h1><p>Plant a little joy. Customize your home. Your garden will keep growing, with no wilting and no rush.</p></div><section class="section"><div class="section-head"><h2>Your enchanted garden</h2><button class="btn small secondary" data-act="seedhelp">Seeds & growth</button></div><div class="grid3">${S.plots.map((p,i)=>{let seed=SEEDS.find(x=>x[0]===p?.seed);let matured=p&&seed&&now()-p.at>=seed[5]*60000;let minutes=p&&seed?Math.ceil(Math.max(0,seed[5]*60000-(now()-p.at))/60000):0;return `<button class="gardenplot" data-plot="${i}"><span class="sprout">${!p?'🌱':matured?seed[2]:'🌿'}</span><b>${!p?'Plant something':matured?'Ready to gather':seed[1]}</b><small class="garden-time" ${p&&seed?`data-harvest-at="${p.at+seed[5]*60000}"`:''}>${!p?'Tap to plant':matured?'Ready to harvest!':'Ready in '+timeUntil(p.at+seed[5]*60000)}</small></button>`}).join('')}</div><p class="tiny">The grove is kind. Planted flowers wait safely until you return.</p></section><section class="section"><div class="section-head"><h2>Make it your own</h2><span class="pill">✨ ${compact(S.coins)} starbits</span></div><div class="tabs"><button data-sub="decor" class="${subtab==='decor'?'selected':''}">Decorations</button><button data-sub="sky" class="${subtab==='sky'?'selected':''}">Skies</button><button data-sub="looks" class="${subtab==='looks'?'selected':''}">Pet style</button></div>${subtab==='decor'?`<div class="grid3" style="margin-top:11px">${DECOR.map(([id,name,emoji,price,need])=>{let own=S.owned.includes(id),active=S.placed.includes(id);return `<div class="shopitem"><div class="emoji">${emoji}</div><b>${name}</b><small>${lvl()<need?'Unlock Lv '+need:own?'Owned':'✦ '+price}</small><button class="btn small ${active?'peach':own?'secondary':''}" data-buy="${id}" ${lvl()<need?'disabled':''}>${active?'Displayed':own?'Display':`Get ✦ ${price}`}</button></div>`}).join('')}</div>`:subtab==='sky'?`<div class="grid2" style="margin-top:12px">${[['day','Morning glow','🌤️'],['dusk','Starlit dusk','🌌'],['dawn','Misty dawn','🌄'],['forest','Forest whisper','🌳']].map(([id,name,emoji])=>`<button class="gamecard" data-sky="${id}" style="border:${S.scene===id?'2px solid #9c86d0':''}"><span class="gameicon">${emoji}</span><span><h3>${name}</h3><small>${S.scene===id?'Selected':'Tap to select'}</small></span></button>`).join('')}</div>`:`<div class="card" style="margin-top:10px"><div class="gueststage">${svgPet(S.pet,stage())}</div><p>Give your companion a new look whenever you like. Family and name stay yours.</p><button class="btn full" data-act="restyle">Customize your pet</button></div>`}</section>`}
function friends(){return `<div class="heading"><span class="kicker">Together is a little more magical</span><h1>Friends' meadow 💞</h1><p>Share a snapshot of your pet. Your family can visit, play together, and build a collection of cherished companions.</p></div><div class="card"><div class="section-head"><div><h3>Invite someone to meet ${esc(S.pet.name)}</h3><p>No login. No public profiles. No chat with strangers.</p></div><span style="font-size:32px">💌</span></div><div class="btn-row"><button class="btn" data-act="share">Share pet invitation</button><button class="btn secondary" data-act="importfriend">Visit a friend's pet</button></div></div><section class="section"><div class="section-head"><h2>Your visiting companions</h2><span class="pill">${S.friends.length} / 35</span></div>${S.friends.length?`<div class="grid2">${S.friends.map((f,i)=>`<button class="gamecard" data-visit="${i}" style="display:block;text-align:center"><div style="height:115px">${svgPet(f.pet,f.stage||0,true)}</div><h3 style="margin:1px 0">${esc(f.pet.name)}</h3><small>Tap for a playdate ♡</small></button>`).join('')}</div>`:`<div class="card" style="text-align:center;padding:27px"><div style="font-size:42px">🐣 🦋 🌸</div><h3>A meadow waiting for friends</h3><p>Invite someone you know, or paste their invitation link to meet their fantasy pet.</p><button class="btn secondary" data-act="importfriend">Meet a friend</button></div>`}</section><div class="note">Pet visits are shared snapshots, not live online multiplayer. A friend can see and play with the pet you send, but their activities do not change your saved pet. Share only with people you know. Avoid real names in pet names.</div>`}
function journal(){let st=stage();return `<div class="heading"><span class="kicker">A tale that keeps growing</span><h1>Our storybook 📖</h1><p>A little record of adventures, progress, and discoveries. Your world belongs to you.</p></div><div class="card"><div style="display:flex;align-items:center;gap:14px"><div style="width:110px;flex:none">${svgPet(S.pet,st,true)}</div><div><span class="pill">${GROWTH[st]}</span><h3 style="margin:7px 0">${esc(S.pet.name)}</h3><p>Level ${lvl()} · ${compact(S.bond)} bond · ${S.counts.games} games · ${S.counts.quests} adventures</p></div></div></div><section class="section"><div class="section-head"><h2>Discovery album</h2><span class="pill">${S.stamps.length} / ${STAMPS.length}</span></div><div class="grid3">${STAMPS.map(st=>`<div class="achievement ${S.stamps.includes(st)?'':'locked'}" style="min-height:65px"><span class="emoji">${S.stamps.includes(st)?st:'❔'}</span><small>${S.stamps.includes(st)?'Found':'Undiscovered'}</small></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Milestones</h2><span class="pill">${ACH.filter(a=>a[3](S)).length} / ${ACH.length}</span></div><div class="badgegrid">${ACH.map(([id,name,emoji,check])=>`<div class="achievement ${check(S)?'':'locked'}"><span class="emoji">${check(S)?emoji:'🔒'}</span><b>${name}</b><small>${check(S)?'Earned':'Keep exploring'}</small></div>`).join('')}</div></section><section class="section"><h2>Our little memories</h2><div class="card">${S.journal.slice(0,18).map(e=>`<div class="item-line"><span style="font-size:17px">✦</span><div style="flex:1"><b>${esc(e.message)}</b><small>${new Date(e.at).toLocaleDateString()}</small></div></div>`).join('')}</div></section><section class="section"><h2>Keep your world safe</h2><div class="card"><p>Your progress is saved automatically on this device and browser. To move to another phone or safeguard your pet, save a backup file.</p><div class="btn-row"><button class="btn secondary" data-act="backup">Export backup</button><button class="btn light" data-act="restore">Import backup</button></div><div class="divider"></div><button class="btn small ghost" data-act="reset">Start a different pet (erase this save)</button></div></section><footer>Made with care. No ads, accounts, tracking scripts, or purchases.</footer>`}
function render(){if(!S){welcome();return}el.innerHTML=`<main class="frame ${view==='home'?'home-screen':''}">${header()}${({home,play,grove,friends,journal})[view]()}${view!=='home'?`<footer>mimblegrove ✦ v${BUILD} · forever a little magic</footer>`:''}</main>${nav()}${modal?modalHTML():''}`;syncTimers()}
function welcome(){el.innerHTML=`<div class="welcome"><div class="welcome-inner"><div class="eyebrow">A tiny universe just for you</div><h1>mimblegrove ✦</h1><div class="creationPet">${svgPet({name:'Mimble',family:'puff',color:0,eyes:'spark',trait:'stars',charm:'curious'},1)}</div><p>Meet a magical little creature. Give it a home, help it grow, and explore a world where friendship never fades.</p><button class="btn" data-act="create">Meet your forever friend →</button><div class="min">Free forever · No accounts · Every pet is safe & happy</div></div></div>${modal?modalHTML():''}`}
function modalHTML(){let body='';if(modal.type==='create'||modal.type==='restyle'){
 const p=creator,edit=modal.type==='restyle';body=`<button class="close" data-act="close" aria-label="Close">×</button><div class="kicker">${edit?'Refresh your magical look':'An egg is about to hatch'}</div><h2>${edit?'A fresh new look':'Create your little wonder'}</h2><p>${edit?'Same wonderful companion, new colors and magic.':'Pick a family, a personality, and a name. No two friendships need look alike.'}</p><div class="creationPet">${svgPet({...p,name:p.name||'Mimble'},1)}</div>${!edit?`<label class="tiny">YOUR PET'S NAME (use a nickname, not your real name)</label><input id="petName" class="field" maxlength="20" value="${esc(p.name)}" placeholder="e.g. Pip, Clover, Moonbean" autocomplete="off">`:''}<label class="tiny">CREATURE FAMILY</label><div class="optiongrid">${FAMILIES.map(([id,name,emoji])=>`<button class="option ${p.family===id?'selected':''}" data-createkey="family" data-createval="${id}"><span style="font-size:23px">${emoji}</span>${name}</button>`).join('')}</div><label class="tiny">COLOR MAGIC</label><div class="optiongrid">${COLORS.map(([name,col],i)=>`<button class="option ${p.color===i?'selected':''}" data-createkey="color" data-createval="${i}" aria-label="${name}"><i class="swatch" style="background:${col}"></i><small style="font-size:9px">${name}</small></button>`).join('')}</div><label class="tiny">EYES</label><div class="optiongrid">${EYES.map(([name,id])=>`<button class="option ${p.eyes===id?'selected':''}" data-createkey="eyes" data-createval="${id}">${name}</button>`).join('')}</div><label class="tiny">MARKINGS</label><div class="optiongrid">${TRAITS.map(([name,id])=>`<button class="option ${p.trait===id?'selected':''}" data-createkey="trait" data-createval="${id}">${name}</button>`).join('')}</div>${!edit?`<label class="tiny">PERSONALITY</label><div class="optiongrid">${CHARMS.map(([id,name,emoji])=>`<button class="option ${p.charm===id?'selected':''}" data-createkey="charm" data-createval="${id}">${emoji} ${name}</button>`).join('')}</div>`:''}<button class="btn full" data-act="${edit?'savestyle':'hatch'}">${edit?'Save new look ✦':'Hatch my new friend ✨'}</button>`;
}else if(modal.type==='stars'){
 body=`<button class="close" data-act="closegame" aria-label="Close">×</button><div class="kicker">A little arcade magic</div><h2>🌠 Star Catch</h2><p>Tap the twinkling stars! There are no bad catches, just new chances to shine.</p><div class="minigame" id="starfield"><div class="scorebar"><span id="starscore">✨ 0</span><span id="starseconds">⏱ 25s</span></div><div style="text-align:center;font-size:64px;margin-top:55px">🌙</div><p style="color:white;text-align:center">${game?.started?'Catch the glow!':'Ready when you are.'}</p></div><div class="btn-row" style="margin-top:12px"><button class="btn full" data-act="${game?.started?'skipstars':'beginstars'}">${game?.started?'Finish this round':'Start catching ✦'}</button></div>`;
}else if(modal.type==='memory'){
 body=`<button class="close" data-act="closegame" aria-label="Close">×</button><div class="kicker">A little brain magic</div><h2>🔮 Rune Pairs</h2><p>Find every matching pair at your own pace. No timer and no wrong answers that count against you.</p><div class="section-head"><span class="pill">${game.matched.length}/6 pairs</span><span class="tiny">${game.turns} tries</span></div><div class="memoryboard">${game.cards.map((symbol,i)=>`<button class="rune ${game.flipped.includes(i)||game.matched.includes(i)?'flipped':''} ${game.matched.includes(i)?'matched':''}" data-rune="${i}" aria-label="Rune ${i+1}" ${game.matched.includes(i)?'disabled':''}>${game.flipped.includes(i)||game.matched.includes(i)?symbol:'✦'}</button>`).join('')}</div><button class="btn small secondary full" data-act="newmemory" style="margin-top:14px">New puzzle</button>`;
}else if(modal.type==='quest'){
 body=`<button class="close" data-act="closegame" aria-label="Close">×</button><div class="kicker">Stories around every bend</div><h2>🗺️ Wander Trails</h2>${!questState?`<p>Which little corner of the world shall you explore? New lands reveal themselves as your friend grows.</p>${BIOMES.map(([id,name,emoji,need])=>`<button class="choice" data-biome="${id}" ${lvl()<need?'disabled':''}>${emoji} ${name}<small>${lvl()<need?'Unlock at level '+need:'Begin a three-scene journey ✦'}</small></button>`).join('')}`:questState.step<3?`<div class="sceneryCard"><div><div class="big">${BIOMES.find(b=>b[0]===questState.biome)[2]}</div><span class="pill">Chapter ${questState.step+1} of 3</span></div></div><p>${esc(questState.story[0])}</p>${[1,2].map(i=>`<button class="choice" data-questchoice="${i}">✦ ${esc(questState.story[i])}</button>`).join('')}`:`<div class="sceneryCard"><div><div class="big">🌟</div><h3>The world smiles back</h3></div></div><p>${esc(S.pet.name)}'s adventure ends with a pocketful of beautiful memories and a new little sparkle of courage. There's always another story waiting.</p><button class="btn full" data-act="questreward">Collect your treasures ✨</button>`}`;
}else if(modal.type==='plot'){
 let p=S.plots[modal.i];body=`<button class="close" data-act="close" aria-label="Close">×</button><div class="kicker">A little seed, a lot of wonder</div><h2>Plant a magical flower</h2><p>Choose a seed for garden spot ${modal.i+1}. Seeds cost a few starbits and bloom even while you're away.</p>${SEEDS.map(([id,name,emoji,price,need,mins])=>`<div class="item-line"><span class="mini">${emoji}</span><div style="flex:1"><b>${name}</b><small>Costs ✦${price} · ${mins} minute${mins===1?'':'s'} to bloom${lvl()<need?' · Level '+need:''}</small></div><button class="btn small" data-plant="${id}" ${lvl()<need||S.coins<price?'disabled':''}>Plant</button></div>`).join('')}`;
}else if(modal.type==='visitor'||modal.type==='invite'){
 let f=modal.friend;body=`<button class="close" data-act="close" aria-label="Close">×</button><span class="kicker">A friend has arrived</span><h2>${esc(f.pet.name)} says hello! ♡</h2><div class="gueststage">${svgPet(S.pet,stage(),true)} ${svgPet(f.pet,clamp(+f.stage||0,0,3),true)}</div><p>A cozy playdate with ${esc(S.pet.name)} and ${esc(f.pet.name)}. Friends bring a little more magic to the meadow.</p>${modal.type==='invite'?`<button class="btn full" data-act="acceptinvite">Welcome ${esc(f.pet.name)} to the meadow</button>`:`<button class="btn full" data-act="playdate">Have a playdate ♡</button><button class="btn small ghost full" data-act="removefriend">Remove visiting pet</button>`}`;
}else if(modal.type==='share'){
 body=`<button class="close" data-act="close" aria-label="Close">×</button><div class="kicker">From your heart to theirs</div><h2>Share ${esc(S.pet.name)} 💌</h2><p>Copy this private invitation and send it to family. It contains only your fantasy pet's name and appearance, not your contact information or your saved progress.</p><textarea readonly id="shareurl" class="field sharecode">${esc(shareURL())}</textarea><button class="btn full" data-act="copyshare">Copy invitation link</button><p class="tiny">Your family will need to make a pet first, then your pets can meet. This is a snapshot, not real-time multiplayer.</p>`;
}else if(modal.type==='importfriend'){
 body=`<button class="close" data-act="close" aria-label="Close">×</button><div class="kicker">Let's meet a new friend</div><h2>Visit a family pet 💞</h2><p>Paste a pet invitation link or a pet code from someone you know. No login is needed.</p><textarea id="friendinput" class="field" placeholder="Paste a Mimblegrove invitation here"></textarea><button class="btn full" data-act="submitfriend">Meet their pet ✦</button>`;
}else if(modal.type==='settings'){
 body=`<button class="close" data-act="close" aria-label="Close settings">×</button><div class="kicker">Make it yours</div><h2>Settings ✧</h2><p>Set the perfect mood for your little world. Your choices stay saved on this device.</p>
 <div class="sound-setting"><div><h3>♫ Peaceful music</h3><p>An original, gentle generative lullaby that plays while you visit.</p></div><button role="switch" class="switch" data-audio="music" aria-label="Peaceful music" aria-checked="${audioPrefs.music}"></button></div>
 <div class="sound-setting"><div><h3>✧ Magic sound effects</h3><p>Soft little sounds for cuddles, spells, rewards and games.</p></div><button role="switch" class="switch" data-audio="effects" aria-label="Sound effects" aria-checked="${audioPrefs.effects}"></button></div>
 <div style="margin:16px 0"><label class="tiny" for="volumeSlider">VOLUME</label><input aria-label="Volume" id="volumeSlider" data-volume type="range" min="0" max="1" step="0.05" value="${audioPrefs.volume}" style="width:100%;accent-color:#9076be"></div>
 <div class="settings-version"><div><strong>Game version ${BUILD}</strong><div class="tiny">${versionStatus}</div></div><button class="btn small secondary" data-act="checkupdate">Check updates</button></div><p class="tiny" style="margin-top:12px">Updates are checked when the game opens or returns to the foreground. When online, the latest version installs without resetting pet progress. Offline play uses your saved game.</p>
 <button class="btn full" data-act="close">Back to ${esc(S.pet.name)} ♡</button>`;
}else if(modal.type==='info'){
 body=`<button class="close" data-act="close" aria-label="Close">×</button><h2>${esc(modal.title)}</h2><p>${esc(modal.body)}</p><button class="btn full" data-act="close">Sounds good ♡</button>`;
}else if(modal.type==='restore'){
 body=`<button class="close" data-act="close" aria-label="Close">×</button><h2>Bring your pet home</h2><p>Import a previously saved .json backup. This will replace the current pet and progress on this browser. Make sure you have a backup of your current pet first.</p><input id="backupfile" type="file" accept=".json,application/json" class="field"><button class="btn full" data-act="restorefile">Import my saved world</button>`;
}else if(modal.type==='reset'){
 body=`<button class="close" data-act="close" aria-label="Close">×</button><h2>A whole new beginning?</h2><p>Resetting erases your current pet, decorations, stamps, and progress on this browser. Export a backup first if you ever want to meet your old friend again.</p><button class="btn full" data-act="backup">Export backup first</button><button class="btn light full" style="margin-top:9px" data-act="resetconfirm">I understand. Erase my pet.</button>`;
}return `<div class="overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`}
function open(type,other={}){modal={type,...other};render()}
function close(){modal=null;render()}
function animatePet(icon='✨',suffix=' ♡'){let pet=$('#petStage');if(pet){pet.classList.remove('act');void pet.offsetWidth;pet.classList.add('act');let b=document.createElement('span');b.className='floatpop';b.textContent=icon+suffix;b.style.left=(43+rand(14))+'%';b.style.top='38%';pet.parentNode.appendChild(b);setTimeout(()=>b.remove(),1200)}}
function syncPetHUD(){let coin=$('#coinHUD'),bond=$('#bondHUD');if(coin)coin.textContent=compact(S.coins);if(bond)bond.textContent=compact(S.bond);let info=levelStatus();let meta=$('.home-meta .tiny'),bar=$('.home-meta .progress span'),badge=$('.hero-badge');if(meta)meta.textContent=info.remaining+' XP to Lv '+Math.min(99,info.L+1)+' · ♡ '+compact(S.bond);if(bar)bar.style.width=info.pct+'%';if(badge)badge.textContent='Lv '+info.L+' ✦ '+GROWTH[stage()]}
function care(type){let m={feed:['enjoys a delicious starberry!','🫐'],brush:['gets a soft fluffy brushing!','✨'],cuddle:['snuggles close and glows!','💗'],pet:['gives you a tiny happy wiggle!','💕']}[type];if(!m)return;const oldStage=stage();let eligible=now()-(S.careCooldown[type]||0)>15000;if(eligible){S.careCooldown[type]=now();S.counts.care++;reward(9,4,2,`${S.pet.name} ${m[0]} +9 XP +4 ✦`);if(S.counts.care%25===0)stampAward(true);if(S.counts.care%6===0)addLog(`Shared ${S.counts.care} caring moments together.`)}else tip(`${S.pet.name} ${m[0]} Next XP reward in ${Math.max(1,Math.ceil(((S.careCooldown[type]||0)+15000-now())/1000))}s.`);if(stage()!==oldStage)render();else syncPetHUD();petFX(type,m[1]);syncTimers();sound(type);save()}
function trick(id){let t=TRICKS.find(x=>x[0]===id);if(!t||lvl()<t[3])return;const oldStage=stage(),last=S.careCooldown['trick-'+id]||0;let mastery=S.tricks[id]||0;if(now()-last>9000){S.careCooldown['trick-'+id]=now();S.tricks[id]=mastery=mastery+1;reward(11,5,2,`${S.pet.name} performs ${t[1]}! Mastery ${mastery} ✨`);if(mastery===5||mastery===20){stampAward(true);addLog(`${S.pet.name} mastered ${t[1]} (${mastery} times)!`)}}else tip(`${S.pet.name} performs ${t[1]}! Next mastery + XP in ${Math.max(1,Math.ceil(((S.careCooldown['trick-'+id]||0)+9000-now())/1000))}s.`);if(stage()!==oldStage)render();else{syncPetHUD();let sm=document.querySelector('[data-trick="'+id+'"] small');if(sm){sm.dataset.mastery=String(mastery);sm.dataset.readyAt=String((S.careCooldown['trick-'+id]||0)+9000)}}petFX('trick',t[2]);syncTimers();sound('trick');save()}
function buy(id){let t=DECOR.find(x=>x[0]===id);if(!t||lvl()<t[4])return;if(S.owned.includes(id)){if(S.placed.includes(id))S.placed=S.placed.filter(a=>a!==id);else S.placed.push(id);tip(S.placed.includes(id)?'A cozy addition to the grove!':'Tucked safely into storage.')}else if(S.coins>=t[3]){S.coins-=t[3];S.owned.push(id);S.placed.push(id);tip(`${t[1]} is yours!`);addLog(`Decorated with ${t[1]}.`)}else{tip('Play games to earn more starbits.')}save();render()}
function plot(i){let p=S.plots[i];if(p){let t=SEEDS.find(x=>x[0]===p.seed);if(t&&now()-p.at>=t[5]*60000){S.plots[i]=null;S.counts.harvest++;reward(15+t[4]*2,t[3]*2,2,`${t[1]} bloomed! +${t[3]*2} ✦`);if(S.counts.harvest%4===0)stampAward(true);addLog(`Harvested ${t[1]} from your garden.`);render()}else tip('Still growing happily. Come back anytime.')}else open('plot',{i})}
function plant(id){let t=SEEDS.find(x=>x[0]===id);if(!t||!modal||modal.type!=='plot')return;if(lvl()<t[4]||S.coins<t[3]){tip('That seed is not available yet.');return}if(S.plots[modal.i])return;S.coins-=t[3];S.plots[modal.i]={seed:id,at:now()};addLog(`Planted ${t[1]} in the grove.`);save();close();tip(`${t[1]} planted! 🌱`)}
function wish(id){getWishes();if(S.wishes.done.includes(id))return;const base=S.wishes.base||{};const need={care:3,game:2,quest:1}[id],count={care:S.counts.care,game:S.counts.games,quest:S.counts.quests}[id];if(count-(base[id]||0)<need){tip(`Not quite yet! ${clamp(count-(base[id]||0),0,need)}/${need} completed.`);return}S.wishes.done.push(id);S.counts.wishes++;reward(24,25,3,'Wish granted! ✦ +25 starbits');save();render()}
function startGame(kind){if(kind==='stars'){game={kind:'stars',started:false,score:0,secs:25,timer:null};open('stars')}else if(kind==='memory'){memoryInit();open('memory')}else if(kind==='quest'){questState=null;open('quest')}}
function memoryInit(){let icons=['🪻','🌙','🍄','🦋','💎','🌸'];game={kind:'memory',cards:[...icons,...icons].map(v=>({v,k:Math.random()})).sort((a,b)=>a.k-b.k).map(x=>x.v),flipped:[],matched:[],turns:0,locked:false};}
function flip(i){
 if(!game||game.kind!=='memory'||game.locked||game.matched.includes(i)||game.flipped.includes(i))return;
 game.flipped.push(i);
 if(game.flipped.length===2){
  game.turns++;
  const [a,b]=game.flipped;
  if(game.cards[a]===game.cards[b]){
   game.matched.push(a,b);game.flipped=[];
   if(game.matched.length===12){
    S.counts.games++;S.counts.memory++;
    const bonus=Math.max(0,18-game.turns)*3;
    reward(45+bonus,28+bonus,4,`All six pairs found! +${45+bonus} XP`);
    if(S.counts.memory%3===0)stampAward(true);
    addLog(`${S.pet.name} completed a Rune Pairs puzzle!`);save();
    setTimeout(()=>{if(modal?.type==='memory'){close();tip('Beautifully played! All your runes matched.')}},650);
   }
  }else{
   game.locked=true;
   setTimeout(()=>{if(game?.kind==='memory'){game.flipped=[];game.locked=false;if(modal?.type==='memory')render()}},750);
  }
 }
 if(modal?.type==='memory')render();
}
function starStart(){if(!game||game.kind!=='stars'||game.started)return;game.started=true;game.score=0;game.secs=25;game.next=0;render();const field=$('#starfield');if(!field)return;let tick=setInterval(()=>{if(!game||game.kind!=='stars'||modal?.type!=='stars'){clearInterval(tick);return}if(document.hidden)return;game.secs--;let node=$('#starseconds');if(node)node.textContent='⏱ '+game.secs+'s';if(game.secs<=0){clearInterval(tick);starFinish()}else{fillStars()}},1000);game.timer=tick;fillStars()}
function fillStars(){let field=$('#starfield');if(!field)return;let stars=field.querySelectorAll('.star');if(stars.length>=3)return;for(let j=stars.length;j<3;j++){let b=document.createElement('button');b.className='star';b.textContent=pick(['⭐','🌟','💫','✨']);b.setAttribute('aria-label','Catch star');let other=[...field.querySelectorAll('.star')];let pos={x:8+rand(70),y:20+rand(59)};for(let attempt=0;attempt<40;attempt++){pos={x:8+rand(70),y:20+rand(59)};if(other.every(z=>Math.hypot(pos.x-parseFloat(z.style.left),pos.y-parseFloat(z.style.top))>23))break}b.style.left=pos.x+'%';b.style.top=pos.y+'%';b.addEventListener('click',()=>{if(!game||game.kind!=='stars')return;game.score++;S.counts.stars++;b.remove();let sc=$('#starscore');if(sc)sc.textContent='✨ '+game.score;let x=$('#starfield');if(x){let z=document.createElement('span');z.className='floatpop';z.style.left=b.style.left;z.style.top=b.style.top;z.textContent='+1 ✦';x.appendChild(z);setTimeout(()=>z.remove(),950)}fillStars()});field.appendChild(b)}}
function starFinish(){if(!game||game.kind!=='stars'||!game.started)return;clearInterval(game.timer);let score=game.score;game.started=false;S.counts.games++;reward(18+score*3,12+score*2,3,`Caught ${score} stars! +${18+score*3} XP and ${12+score*2} ✦`);if(score>=15||S.counts.stars%35<score)stampAward(score>=22);if(score>=15)addLog(`${S.pet.name} caught ${score} stars in Star Catch.`);close()}
function questBiome(id){let b=BIOMES.find(x=>x[0]===id);if(!b||lvl()<b[3])return;questState={biome:id,step:0,history:[],story:pick(STORIES)};render()}
function questChoice(i){if(!questState||questState.step>=3)return;questState.history.push(questState.story[i]);questState.step++;questState.story=pick(STORIES);render()}
function questFinish(){if(!questState||questState.step!==3)return;let bonus=BIOMES.find(x=>x[0]===questState.biome)[3];S.counts.quests++;S.counts.games++;let a=42+bonus*2+rand(20),b=26+Math.round(bonus*1.5)+rand(12);reward(a,b,5,`New memories! +${a} XP and ${b} ✦`);if(S.counts.quests%3===0)stampAward(true);else stampAward();addLog(`${S.pet.name} explored ${BIOMES.find(x=>x[0]===questState.biome)[1]}.`);questState=null;close()}
function shareData(){return {v:1,id:S.id,pet:S.pet,stage:stage(),level:lvl()}}
function codeOf(d){let arr=new TextEncoder().encode(JSON.stringify(d));return btoa(String.fromCharCode(...arr)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function shareURL(){return location.origin+location.pathname+'#meet='+codeOf(shareData())}
function decodeInvite(raw){try{let match=String(raw).match(/(?:#meet=|^)([a-zA-Z0-9_-]{20,1300})/);if(!match)return null;let c=match[1].replace(/-/g,'+').replace(/_/g,'/');let obj=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c),x=>x.charCodeAt(0))));if(obj.v!==1||typeof obj.id!=='string'||!/^p[a-z0-9]{5,16}$/.test(obj.id)||typeof obj.pet?.name!=='string'||obj.pet.name.length>20)return null;return {id:obj.id,pet:normPet(obj.pet),stage:clamp(+obj.stage||0,0,3),level:clamp(+obj.level||1,1,99)}}catch(e){return null}}
function acceptInvite(f){if(!S){tip('Create your own pet first!');return}if(f.id===S.id){tip('That is your own lovely pet!');return}let n=S.friends.findIndex(x=>x.id===f.id);if(n===-1&&S.friends.length>=35){tip('Your meadow is full. Remove an older guest first.');return}if(n===-1)S.friends.push(f);else S.friends[n]=f;save();location.hash='';open('visitor',{friend:f});tip(`${f.pet.name} joined your visiting meadow!`)}
function handleInviteFromURL(){let code=location.hash;if(!code.startsWith('#meet='))return;let f=decodeInvite(code);if(!f)return;if(S&&f.id!==S.id){modal={type:'invite',friend:f};render()}}
function playdate(f){let key=f.id+'|'+day();if(S.visitorReward[key]){tip(`${S.pet.name} and ${f.pet.name} play among the flowers! ♡`)}else{S.visitorReward[key]=true;S.counts.friends++;reward(30,15,5,`A delightful playdate! +30 XP +15 ✦`);addLog(`${S.pet.name} played with ${f.pet.name}!`);save()}render()}
function backup(){if(!S)return;let data=JSON.stringify({mimblegrove:1,save:S,exported:new Date().toISOString()},null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mimblegrove-'+S.pet.name.replace(/[^a-z0-9]/gi,'-')+'-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);tip('Backup file saved to your downloads.')}
function restoreFile(file){if(!file){tip('Choose a .json backup file first.');return}if(file.size>150000){tip('That backup is too large.');return}let rd=new FileReader();rd.onload=()=>{try{let obj=JSON.parse(rd.result);let candidate=obj?.mimblegrove===1?obj.save:null;if(!candidate?.pet||!candidate?.version||!Array.isArray(candidate.plots)||!Array.isArray(candidate.friends))throw Error('invalid');let raw=localStorage.getItem(KEY);localStorage.setItem(KEY,JSON.stringify(candidate));let loaded=load();if(!loaded){if(raw)localStorage.setItem(KEY,raw);else localStorage.removeItem(KEY);throw Error('invalid')}S=loaded;modal=null;view='home';render();tip('Welcome home! Your pet is restored.')}catch(e){tip('That is not a valid Mimblegrove backup.')}};rd.readAsText(file)}
function resetSave(){localStorage.removeItem(KEY);S=null;modal=null;creator={family:'puff',color:0,eyes:'spark',trait:'stars',charm:'curious',name:''};view='home';render();tip('A new beginning awaits!')}
async function copy(text){try{await navigator.clipboard.writeText(text);tip('Invitation copied! Send it to your family.')}catch(e){let area=$('#shareurl');if(area){area.focus();area.select();tip('Select and copy the highlighted invitation.')}else tip('Use your browser’s copy command.')}}
function handleAction(act){switch(act){case 'checkupdate':checkFresh();tip('Checking for the newest version…');break;case 'create':creator={family:'puff',color:0,eyes:'spark',trait:'stars',charm:'curious',name:''};open('create');break;case 'close':close();break;case 'closegame':if(game?.kind==='stars'&&game.started)starFinish();else close();break;case 'hatch':{let name=($('#petName')?.value||creator.name||'').trim().replace(/\s+/g,' ').slice(0,20);if(!name){tip('Give your little friend a name first!');return}creator.name=name;S=fresh(normPet(creator));save();modal=null;view='home';render();tip(`Welcome home, ${S.pet.name}! ✨`);handleInviteFromURL();break}case 'restyle':creator={...S.pet};open('restyle');break;case 'savestyle':S.pet={...S.pet,...normPet(creator),name:S.pet.name,charm:S.pet.charm};addLog(`${S.pet.name} tried out a new look.`);save();close();tip('New look, same wonderful friend!');break;case 'feed':case 'brush':case 'cuddle':case 'pet':care(act);break;case 'seedhelp':open('info',{title:'A garden that waits for you 🌱',body:'Tap an empty plot to plant a seed. Each seed costs starbits. It matures after a few real-world minutes, including while you are away. Mature plants never wilt or disappear and can be collected for starbits, XP, and occasional rare wonders.'});break;case 'share':open('share');break;case 'importfriend':open('importfriend');break;case 'submitfriend':{let f=decodeInvite($('#friendinput')?.value||'');if(!f){tip('That invitation is not quite right.');return}acceptInvite(f);break}case 'acceptinvite':acceptInvite(modal.friend);break;case 'copyshare':copy(shareURL());break;case 'playdate':playdate(modal.friend);break;case 'removefriend':S.friends=S.friends.filter(f=>f.id!==modal.friend.id);save();close();tip('The visiting pet has left the meadow.');break;case 'backup':backup();break;case 'restore':open('restore');break;case 'restorefile':restoreFile($('#backupfile')?.files?.[0]);break;case 'reset':open('reset');break;case 'resetconfirm':resetSave();break;case 'beginstars':starStart();break;case 'skipstars':starFinish();break;case 'newmemory':memoryInit();render();break;case 'questreward':questFinish();break;default:break}}
document.addEventListener('input',e=>{if(e.target.id==='petName')creator.name=e.target.value});
document.addEventListener('click',e=>{let a=e.target.closest('[data-view],[data-act],[data-trick],[data-buy],[data-sky],[data-sub],[data-plot],[data-plant],[data-start],[data-wish],[data-rune],[data-biome],[data-questchoice],[data-createkey],[data-visit],[data-hometab]');if(!a)return;if(a.disabled)return;let d=a.dataset;if(d.view){view=d.view;modal=null;render();scrollTo({top:0,behavior:'instant'})}else if(d.hometab){homeTab=d.hometab;render()}else if(d.createkey){let key=d.createkey;if(key==='color')creator[key]=Number(d.createval);else creator[key]=d.createval;render();let n=$('#petName');if(n&&creator.name)n.value=creator.name}else if(d.act){handleAction(d.act)}else if(d.trick){trick(d.trick)}else if(d.buy){buy(d.buy)}else if(d.sky){S.scene=d.sky;save();render();tip('A new sky to dream beneath!')}else if(d.sub){subtab=d.sub;render()}else if(d.plot!==undefined){plot(Number(d.plot))}else if(d.plant){plant(d.plant)}else if(d.start){startGame(d.start)}else if(d.wish){wish(d.wish)}else if(d.rune!==undefined){flip(Number(d.rune))}else if(d.biome){questBiome(d.biome)}else if(d.questchoice){questChoice(+d.questchoice)}else if(d.visit!==undefined){open('visitor',{friend:S.friends[Number(d.visit)]})}});
window.addEventListener('hashchange',handleInviteFromURL);
window.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&modal?.type!=='stars')render()});
window.addEventListener('load',registerUpdates);
// Initialize new day baselines for goals, without ever resetting progress or hurting pets.
if(S){if(!S.wishes||S.wishes.date!==day()){S.wishes={date:day(),done:[],base:{care:S.counts.care,game:S.counts.games,quest:S.counts.quests}};save()}else if(!S.wishes.base){S.wishes.base={care:S.counts.care,game:S.counts.games,quest:S.counts.quests};save()}}
render();handleInviteFromURL();
})();
</script></body></html>
